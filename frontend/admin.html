<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hive Ballot — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="mark">Hive<span>Ballot</span></div>
      <nav>
        <a href="index.html">Vote</a>
        <a href="results.html">Results</a>
      </nav>
    </div>

    <!-- Admin login -->
    <div id="loginSection">
      <h1 class="headline">Admin sign-in</h1>
      <p class="lede">Set the voting window, manage candidates, and build the voter roster.</p>
      <div class="card">
        <div id="loginAlert" class="alert"></div>
        <form id="adminLoginForm">
          <div class="field">
            <label for="adminUser">Username</label>
            <input type="text" id="adminUser" required>
          </div>
          <div class="field">
            <label for="adminPass">Password</label>
            <input type="password" id="adminPass" required>
          </div>
          <button type="submit" class="btn">Sign in</button>
        </form>
      </div>
    </div>

    <!-- Admin dashboard -->
    <div id="dashboardSection" style="display:none;">
      <h1 class="headline">Election control</h1>
      <p class="lede">Three things to set up: when voting runs, who's running, and who's eligible.</p>

      <div class="admin-tabs">
        <button id="tabSchedule" class="active">Schedule</button>
        <button id="tabCandidates">Candidates</button>
        <button id="tabRoster">Voter roster</button>
      </div>

      <!-- Schedule -->
      <div id="paneSchedule">
        <div class="card">
          <div id="scheduleAlert" class="alert"></div>
          <form id="scheduleForm">
            <div class="field">
              <label for="electionTitle">Election title</label>
              <input type="text" id="electionTitle" required>
            </div>
            <div class="field">
              <label for="startTime">Voting opens</label>
              <input type="datetime-local" id="startTime" required>
            </div>
            <div class="field">
              <label for="endTime">Voting closes</label>
              <input type="datetime-local" id="endTime" required>
            </div>
            <button type="submit" class="btn">Save schedule</button>
          </form>
        </div>
      </div>

      <!-- Candidates -->
      <div id="paneCandidates" style="display:none;">
        <div class="card" style="margin-bottom:24px;">
          <div id="addCandAlert" class="alert"></div>
          <form id="addCandidateForm">
            <div class="field">
              <label for="candName">Name</label>
              <input type="text" id="candName" required>
            </div>
            <div class="field">
              <label for="candDept">Department / class (optional)</label>
              <input type="text" id="candDept">
            </div>
            <div class="field">
              <label for="candSlogan">Slogan (optional)</label>
              <input type="text" id="candSlogan">
            </div>
            <div class="field">
              <label for="candPhoto">Photo (optional)</label>
              <input type="file" id="candPhoto" accept=".jpg,.jpeg,.png,.webp">
              <div class="hint">JPG, PNG, or WEBP — up to 4MB</div>
            </div>
            <button type="submit" class="btn">Add candidate</button>
          </form>
        </div>

        <div class="card">
          <table>
            <thead><tr><th>Candidate</th><th>Department</th><th>Votes</th><th></th></tr></thead>
            <tbody id="candidateTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- Voter roster -->
      <div id="paneRoster" style="display:none;">
        <div class="card" style="margin-bottom:24px;">
          <div id="addVoterAlert" class="alert"></div>
          <form id="addVoterForm">
            <div class="field">
              <label for="voterName">Full name</label>
              <input type="text" id="voterName" required>
            </div>
            <div class="field">
              <label for="voterCompanyId">Company ID</label>
              <input type="text" id="voterCompanyId" placeholder="e.g. EMP1004" required>
            </div>
            <div class="field">
              <label for="voterEmail">Company email</label>
              <input type="email" id="voterEmail" required>
            </div>
            <button type="submit" class="btn">Add to roster</button>
          </form>
        </div>

        <div class="card">
          <table>
            <thead><tr><th>Name</th><th>Company ID</th><th>Email</th><th>Voted</th><th></th></tr></thead>
            <tbody id="voterTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
