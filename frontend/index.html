<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Voting System — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="mark">Secure<span>Vote</span></div>
      <nav>
        <a href="results.html">Results</a>
        <a href="admin.html">Admin</a>
      </nav>
    </div>

    <h1 class="headline">Sign in to vote.</h1>
    <p class="lede">Use the company ID and email already on file with your election admin. No account creation needed — and your vote is never linked back to your identity once cast.</p>

    <div class="card">
      <div id="alertBox" class="alert"></div>
      <form id="loginForm">
        <div class="field">
          <label for="companyId">Company ID</label>
          <input type="text" id="companyId" placeholder="e.g. EMP1001" required autocomplete="username">
        </div>
        <div class="field">
          <label for="companyEmail">Company email</label>
          <input type="email" id="companyEmail" placeholder="you@company.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
